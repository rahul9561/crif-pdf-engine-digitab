[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crif-pdf-engine"
version = "0.1.0"
description = "Render Digitap/CRIF credit report JSON into the CRIF 'Credit Information Report' PDF."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.5,<3",
    "weasyprint>=60",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pymupdf>=1.23"]

[project.scripts]
crif-pdf = "crif_pdf_engine.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["crif_pdf_engine*"]

[tool.setuptools.package-data]
crif_pdf_engine = [
    "templates/*.html",
    "templates/sections/*.html",
    "static/css/*.css",
    "static/fonts/*.ttf",
    "static/fonts/*.txt",
    "static/img/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders a 100-account report (~30s); skip with -m \"not slow\""]
